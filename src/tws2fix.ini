; TWS2-Fixing-Project configuration. Place next to dinput8.dll in the Total War: SHOGUN 2 folder.
; 1 = on, 0 = off. Missing keys use the defaults shown here.

[general]
; Write tws2fix.log in the game folder. Keep on while testing.
log=1
; Apply engine-address patches even when empire.retail.dll is not the verified May 2023 build.
; Leave at 0 unless you know what you are doing. Import-table patches (below) work on any build.
allow_unknown_build=0

[patches]
; Keep the mouse inside the game window while the game is in the foreground (fixes the cursor
; escaping to a second monitor when edge-scrolling). Released automatically on alt-tab.
cursor_clip=1

; Turn the game's windowed mode into a borderless window that covers the monitor.
; Requires: in the game's graphics options set Windowed mode and the resolution to your desktop
; resolution. Has no effect in exclusive fullscreen.
borderless=0

; Fix the agent-action success chance clamp. Nine of the engine's agent actions (assassinate,
; sabotage, apprehend and others) clamp the chance to 5..95 with an unsigned comparison, so a
; negative total (weak agent, strong target) shows and rolls as 95% instead of 5%.
; Engine-address patch: only applied on the verified May 2023 build, after a byte check.
agent_chance_clamp=1

; UI scaling. The game's UI shrinks with resolution; this draws it larger at native resolution, with the
; mouse following. Settings:
;   ui_scale=auto   the UI gets the size it has at 1920x1080 on any screen (the recommended setting, and
;                   the default). At 1920x1080 or lower it does nothing, so it is safe to leave on.
;   ui_scale=off    no scaling.
;   ui_scale=1.5    a factor of your own (1.333 at 2560x1440 and 2.0 at 3840x2160 equal "auto"; the most
;                   a screen allows is width/1280 or height/1024, whichever is smaller).
; Loading screens are not scaled. Engine-address patch, verified build only.
ui_scale=auto
; Diagnostics for a screen where the mouse and the UI disagree: ui_scale_log_callers=1 writes every distinct
; engine caller of the UI-rect getter to the log once (RVA); ui_scale_small_callers=0x013F7C17,... makes
; the listed callers see the scaled rect instead of the screen. Normally both unset.
;ui_scale_log_callers=0
;ui_scale_log_box=0
;ui_scale_small_callers=

; Settlement and tree render box. The campaign display only draws settlement/building models and trees
; inside a box of +-350 map units around the origin; larger map mods lose their settlements and trees
; beyond that. This is the half-size of both boxes. 1000 covers any map (the vanilla world is +-640 by +-320) and costs nothing on the
; vanilla map; 0 leaves the engine's 350. Engine-address patch.
settlement_box=1000

; Video memory. A 32-bit game is usually told it has about 2.9 GB of video memory whatever the card. Set
; the figure in MB to override what the engine budgets its textures from (maximum 4095). 0 = off.
; Try 4095 in DirectX 11 mode; in DirectX 9 mode stay lower (3072) because the D3D9 runtime keeps
; system-memory copies of managed textures inside the 4 GB address space.
vram_mb=0

[battle]
; Battle fixes ported from ShakuEight's Shogun2-fix (Apache-2.0, see third_party/). They change the
; battle simulation: use them in single player and replays only; a changed simulation desyncs
; multiplayer. Each fix byte-checks its own patch sites and refuses on any difference.
; Master switch for the whole section.
battle_fixes=1
; Units ordered through gates, doorways and round corners file through one man at a time; the fix
; lays the formation past the narrow stretch so the men run through as a column and re-form.
fix_path=1
; Artillery ordered at a unit aims at the end of the enemy line; the fix aims at its middle.
fix_artillery=1
; Fire by Rank: ~10 s before the first volley, Hattori and Ikko gun units stop after three volleys,
; ranks beyond the third never fire, reload waits.
fix_fire_by_rank=1
; In large sieges the defender's units answer move orders late once attackers climb the walls.
fix_siege=1
; A unit ordered onto a wall section no longer marches to a staging point inside the castle first.
fix_wall_manning=1
; A yari wall unit that breaks mid-charge stands in its wall (counted as routing) and keeps killing.
fix_zombie_yari=1
; Siege defence: men on a gatehouse die at Start Battle when the campaign left the gates open.
fix_wall_collapse=1
; G / Ctrl+G / Ctrl+number accept a single unit as a group.
fix_single_unit_group=1
; Missile units in guard mode no longer chase a target that left their range or shoot shattered units.
fix_guard_mode=1
; Fall of the Samurai: units with Kneel Fire on take move orders (Kneel Fire stays on).
fix_kneel_fire=1

; Alt group-move (new control, not a bug fix). With several units selected, hold Alt and press-and-hold
; the left button on the ground and move the mouse: the selection follows the cursor as a block, each
; unit keeping its place, frontage and facing. While still holding the button, hold Ctrl and move the mouse
; sideways to turn the block in place about its middle. Release the button to issue the order. Single
; player only, like the fixes above.
alt_group_move=1
; Rotation speed while Ctrl is held: units of 1/65536 of a turn per pixel of mouse travel (64 = a full
; turn in about 1000 pixels).
alt_rotate_speed=64
; Diagnostics for testing the Alt group-move: per-hold traces in tws2fix.log. Normally 0.
alt_debug_log=0
